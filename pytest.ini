[pytest]
minversion = 6.0
addopts =
    -v
    --tb=short
    --html=tests/reports/report.html
    --self-contained-html
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    # 测试类型（按速度分类）
    unit: 单元测试（无外部依赖，< 1s，使用 Mock）
    integration: 集成测试（需要数据库/Redis，不需要 API 服务器，< 10s）
    e2e: 端到端测试（需要完整 API 服务器，> 10s）

    # 测试场景
    api: API endpoint tests
    functional: Functional tests for UI features
    smoke: 冒烟测试（核心功能快速验证）

    # 依赖标记
    external: 需要外部服务（RSSHub/wechat2rss，CI 环境跳过）
    slow: 慢速测试（> 5s）

    # 功能模块
    auth: 认证相关测试
    rss: RSS 订阅相关测试
    tts: TTS 语音相关测试
    database: 数据库相关测试

    # 其他
    asyncio: Async tests (auto-detected with asyncio_mode=auto)
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
