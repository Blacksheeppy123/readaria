<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- PWA配置由 vite-plugin-pwa 注入 manifest 链接 -->
    <meta name="theme-color" content="#1989fa" />
    <!-- Chrome/Android PWA -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS PWA支持 (Safari) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Readaria" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 描述和关键词 -->
    <meta name="description" content="Readaria - Your feeds, narrated. RSS reader with AI summaries and text-to-speech." />
    <meta name="keywords" content="RSS,阅读器,知识管理,订阅,新闻聚合,podcast,AI summaries" />

    <title>Readaria - Your Feeds, Narrated</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
